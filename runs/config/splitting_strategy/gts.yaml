_target_: src.preprocess.splits.GlobalTimeSplitter

# - float in [0, 1]: quantile of timestamp on the dataframe
# - int or datetime: absolute cutoff; rows with timestamp <= threshold stay on the train (earlier) side.
# - str: parsed with time_format (required), e.g. "%Y-%m-%d"; then behaves like datetime.
time_threshold: 0.9
time_format:  # pass only when `time_threshold` is string

val_time_threshold: 0.9

train_max_events: ${dataset.seq_length_items}  # includes the training target event
remove_unseen_targets: true
remove_unseen_users: false
