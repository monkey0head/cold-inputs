_target_: src.preprocess.splits.GlobalTimeSplitter

# 1-day test / 1-day validation, val-by-time, for the Yambda datasets. Timestamps
# are SECONDS there, so 1 day = 86400, and the thresholds below are ABSOLUTE (the
# splitter passes ints through unchanged). Both Yambda listens sets end at
# max_ts = 26000000, so the two cutoffs are shared and give the 50m and 500m sets
# the same test period.
time_threshold: 25913600       # 26000000 - 86400   (interactions after this = test, last 1 day)
time_format:                   # unused (thresholds are absolute ints)

val_type: by_time
val_num_users:                 # unused for by_time
val_time_threshold: 25827200   # 26000000 - 172800  (train interactions after this = validation, preceding day)

# cold filtering happens inside the splitter, on separated input/target
remove_cold_items: true    # drop validation/test items absent from train
remove_cold_users: false

random_state: 42
