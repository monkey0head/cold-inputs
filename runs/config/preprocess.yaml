defaults:
  - _self_
  - dataset: Beauty2014

engine: polars

preprocessing_params:
  n_core_filtering: true  # Iterative user/item 5-core filtering before splitting.
  # Independent of N-core filtering; repeated during N-core iterations when enabled.
  rm_consecutive_dups: true
  item_min_count: 5  # Used only when n_core_filtering is enabled.
  user_min_count: 5  # Used only when n_core_filtering is enabled.
  min_relevance: null  # Dataset-specific threshold, applied before deduplication.
  num_users: null  # Keep all users.
  last_n_days: null  # Optional trailing window, applied before every other filter.

suffix: cold_inputs
